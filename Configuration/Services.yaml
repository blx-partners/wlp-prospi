services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Blx\WlpProspi\:
    resource: '../Classes/*'
    exclude:
      - '../Classes/Domain/Filter/*'

  cache.wlpprospi_api:
    class: TYPO3\CMS\Core\Cache\Frontend\FrontendInterface
    factory: ['@TYPO3\CMS\Core\Cache\CacheManager', 'getCache']
    arguments: ['wlpprospi_api']

  Blx\WlpProspi\Service\ProspiApiClient:
    arguments:
      $cache: '@cache.wlpprospi_api'
