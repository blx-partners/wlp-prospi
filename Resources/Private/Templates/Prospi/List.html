<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Default" />

<f:section name="Main">
    <f:asset.script identifier="wlpProspiFilter" src="EXT:wlp_prospi/Resources/Public/JavaScript/prospi-filter.js" defer="1" />

    <f:render partial="Filter/Form" arguments="{filters: filters, options: options, hasActiveFilters: hasActiveFilters}" />

    <f:render partial="Course/TypeHint" />

    <p class="prospi-results">
        <strong>{courses -> f:count()}</strong> <f:translate key="results.found" />
    </p>

    <f:if condition="{courses}">
        <f:then>
            <ul class="prospi-list">
                <f:for each="{courses}" as="course" iteration="iterator">
                    <f:render partial="Course/Card" arguments="{course: course, index: iterator.index}" />
                </f:for>
            </ul>
        </f:then>
        <f:else>
            <p class="prospi-empty"><em><f:translate key="results.empty" /></em></p>
        </f:else>
    </f:if>
</f:section>
</html>
