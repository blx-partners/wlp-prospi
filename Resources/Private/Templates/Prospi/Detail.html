<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Default" />

<f:section name="Main">
    <p><f:render section="BackLink" /></p>

    <article class="prospi-detail">
        <div class="prospi-detail__badges">
            <span class="prospi-badge"><f:translate key="kurstyp.{course.kurstyp}" default="{course.kurstyp}" /></span>
            <f:for each="{course.modes}" as="mode">
                <span class="prospi-badge"><f:translate key="mode.{mode}" default="{mode}" /></span>
            </f:for>
        </div>

        <f:render partial="Course/TypeHint" />

        <h1 class="prospi-detail__title">{course.name}<f:if condition="{course.nummer}"> ({course.nummer})</f:if></h1>
        <p class="prospi-detail__subtitle">{course.trainer}<f:if condition="{course.trainerFunktion}"> – {course.trainerFunktion}</f:if></p>

        <p><strong><f:translate key="detail.period" /></strong> {course.von} – {course.bis}</p>
        <f:if condition="{course.plzDisplay}">
            <p><strong><f:translate key="detail.location" /></strong> {course.plzDisplay}</p>
        </f:if>
        <f:if condition="{course.kurstyp} != 'CLOSED'">
            <p><strong><f:translate key="detail.freeSlots" /></strong> <f:render partial="Course/FreeSlots" arguments="{course: course}" /></p>
        </f:if>

        <f:if condition="{course.beschreibung}">
            <h2><f:translate key="detail.description" /></h2>
            <p>{course.beschreibung}</p>
        </f:if>

        <h2><f:translate key="detail.dates" /></h2>
        <ul>
            <f:for each="{course.termine}" as="termin">
                <li>
                    {termin.termin} – {termin.uhrzeit} –
                    <strong><f:translate key="mode.{termin.typ}" default="{termin.typ}" /></strong><f:if condition="{termin.ort}"> – {termin.ort}</f:if>
                </li>
            </f:for>
        </ul>

        <p>
            <f:if condition="{course.bookingUrl}">
                <f:then>
                    <a class="prospi-button" href="{course.bookingUrl}" target="_blank" rel="noopener"><f:translate key="booking.label" /></a>
                </f:then>
                <f:else>
                    <button type="button" class="prospi-button" disabled="disabled" title="{f:translate(key: 'booking.unavailable')}"><f:translate key="booking.label" /></button>
                </f:else>
            </f:if>
        </p>

        <p><f:render section="BackLink" /></p>
    </article>
</f:section>

<f:section name="BackLink">
    <f:link.action action="list" class="prospi-button prospi-button--secondary">
        <span aria-hidden="true">←</span> <f:translate key="detail.back" />
    </f:link.action>
</f:section>
</html>
